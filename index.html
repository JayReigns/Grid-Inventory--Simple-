<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grid Inventory Prototype</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Grid Inventory</h1>
    <p class="sub">Variable-size, rotatable items. Drag to move (items auto-rotate when that avoids displacing others), <kbd>R</kbd> while dragging to rotate, right-click to rotate in place, double-click to remove.</p>
  </header>

  <main>
    <aside class="panel">
      <section>
        <h2>Grid</h2>
        <div class="row">
          <label>Width <input id="cfg-width" type="number" min="1" max="16" value="5" /></label>
          <label>Cells <input id="cfg-cells" type="number" min="1" max="256" value="22" /></label>
        </div>
        <div class="row">
          <button id="btn-rebuild" class="primary">Rebuild grid</button>
          <button id="btn-clear">Clear items</button>
        </div>
        <div class="presets">
          <button data-preset="5,22">5 × 22 cells</button>
          <button data-preset="6,30">6 × 30 cells</button>
          <button data-preset="8,45">8 × 45 cells</button>
          <button data-preset="10,100">10 × 100 cells</button>
        </div>
        <div id="stats" class="stats"></div>
      </section>

      <section>
        <h2>Add item</h2>
        <div class="row">
          <label>W <input id="add-w" type="number" min="1" max="16" value="2" /></label>
          <label>H <input id="add-h" type="number" min="1" max="16" value="1" /></label>
          <button id="btn-add" class="primary">Add</button>
        </div>
        <div class="presets">
          <button data-size="1,1">1×1</button>
          <button data-size="2,1">2×1</button>
          <button data-size="1,2">1×2</button>
          <button data-size="2,2">2×2</button>
          <button data-size="3,1">3×1</button>
          <button data-size="4,1">4×1</button>
          <button data-size="3,2">3×2</button>
          <button data-size="4,4">4×4</button>
        </div>
        <div class="row">
          <button id="btn-random">Add random item</button>
          <button id="btn-fill">Fill until full</button>
        </div>
      </section>

      <section>
        <h2>Log</h2>
        <div id="log" class="log" aria-live="polite"></div>
      </section>
    </aside>

    <section class="stage">
      <div id="grid" class="grid" aria-label="Inventory grid">
        <div id="cells" class="cells"></div>
        <div id="items" class="layer items"></div>
        <div id="preview" class="layer preview"></div>
      </div>
      <div class="legend">
        <span><i class="sw ok"></i> valid drop</span>
        <span><i class="sw bad"></i> invalid drop</span>
        <span><i class="sw shift"></i> other items that will shift</span>
        <span><i class="sw void"></i> non-existent cell</span>
      </div>
    </section>
  </main>

  <script src="inventory.js"></script>
  <script src="app.js"></script>
</body>
</html>
